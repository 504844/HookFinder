plugins {
    id 'java'
}

group = 'com.hookfinder'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.ow2.asm:asm:9.6'
    implementation 'org.ow2.asm:asm-commons:9.6'
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'com.google.code.gson:gson:2.11.0'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.hookfinder.Main',
                'Premain-Class': 'com.hookfinder.agent.HookFinderAgent',
                'Agent-Class': 'com.hookfinder.agent.HookFinderAgent',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true'
        )
    }
}

task fatJar(type: Jar) {
    group = 'build'
    description = 'Builds a fat JAR with all dependencies included'
    archiveClassifier.set('all')

    manifest {
        attributes(
                'Main-Class': 'com.hookfinder.Main',
                'Premain-Class': 'com.hookfinder.agent.HookFinderAgent',
                'Agent-Class': 'com.hookfinder.agent.HookFinderAgent',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true'
        )
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    with jar
}